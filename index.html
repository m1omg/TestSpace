<!doctype html>
<html lang="en">

    <title>The Night Ward</title>
    <meta name="description" content="A first-person horror game about screening and treating patients at a remote overnight veterinary clinic." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
